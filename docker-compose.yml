services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Port unik 3428 (bisa dikustomisasi via FRONTEND_PORT di .env)
      - "${FRONTEND_PORT:-3428}:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE_URL=
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Port unik 8428 hanya terikat ke localhost untuk keamanan & diagnosa
      - "127.0.0.1:${BACKEND_PORT:-8428}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://cest:cest_local_pass@db:5432/cest
      - AUDIO_STORAGE_DIR=/app/data/audio
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: cest
      POSTGRES_USER: cest
      POSTGRES_PASSWORD: cest_local_pass
    # Port 5432 TIDAK diekspos ke host VPS agar 100% aman dari konflik port database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cest -d cest"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
